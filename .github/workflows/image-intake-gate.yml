name: Image intake gate

on:
  pull_request:
    branches:
      - static-migration
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  image-intake:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build, collect the live image manifest, and run the intake gate
        run: npm run build
      - name: Prove that the allow-list only shrank
        # Report-only under Fable 5 ruling R-A, 28 Jul 2026. Restore blocking when a no-op PR reports changedOrNewEntries 0.
        continue-on-error: true
        if: github.event_name == 'pull_request'
        run: node scripts/check-image-intake.mjs --base-ref=origin/${{ github.base_ref }}
